# =============================================================================
# docker-compose.prod.yml — Produção (Oracle Cloud VM)
#
# Uso:
#   export IMAGE_TAG=<SHA_DO_COMMIT>
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# O MySQL NÃO está definido aqui — utiliza a instância gerenciada Oracle Cloud.
# O proxy reverso é feito pelo Nginx instalado no SO (não em container).
# Backend e frontend ficam acessíveis apenas via localhost.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Django Backend (Gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/hermogenes-batista/projeto_aplicado-praticas_de_mercado-backend:${IMAGE_TAG}
    container_name: django_backend
    restart: unless-stopped
    ports:
      # Acessível apenas localmente — o Nginx do SO faz o proxy
      - "127.0.0.1:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=praticas_de_mercado.settings
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}

      # MySQL Oracle Cloud (IP/hostname privado)
      - DB_ENGINE=mysql
      - DB_HOST=${MYSQL_HOST}
      - DB_PORT=${MYSQL_PORT:-3306}
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}

      # CORS / CSRF
      - CORS_ALLOW_ALL_ORIGINS=False
      - CORS_ALLOW_CREDENTIALS=True
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}

      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # Next.js Frontend (standalone)
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/hermogenes-batista/projeto_aplicado-praticas_de_mercado-frontend:${IMAGE_TAG}
    container_name: nextjs_frontend
    restart: unless-stopped
    ports:
      # Acessível apenas localmente — o Nginx do SO faz o proxy
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
