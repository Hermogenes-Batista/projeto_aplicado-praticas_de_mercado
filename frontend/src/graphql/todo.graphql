query TodoItems($isResolved: Boolean) {
  items(isResolved: $isResolved) {
    id
    name
    createdAt
    updatedAt
    isResolved
    activity {
      id
      name
    }
  }
}

query TodoActivities {
  activities {
    id
    name
    createdAt
    updatedAt
    isResolved
  }
}

mutation CreateTodoActivity($name: String!) {
  createActivity(name: $name) {
    activity {
      id
      name
      createdAt
      updatedAt
      isResolved
    }
    errors
  }
}

mutation UpdateTodoActivity($id: UUID!, $name: String!) {
  updateActivity(id: $id, name: $name) {
    activity {
      id
      name
      createdAt
      updatedAt
      isResolved
    }
    errors
  }
}

mutation DeleteTodoActivity($id: UUID!) {
  deleteActivity(id: $id) {
    success
    errors
  }
}

mutation CompleteTodoActivity($id: UUID!, $isResolved: Boolean!) {
  completeActivity(id: $id, isResolved: $isResolved) {
    activity {
      id
      name
      createdAt
      updatedAt
      isResolved
    }
    errors
  }
}

mutation CreateTodoItem(
  $name: String!
  $activityId: UUID!
  $isResolved: Boolean
) {
  createItem(
    name: $name
    activityId: $activityId
    isResolved: $isResolved
  ) {
    item {
      id
      name
      createdAt
      updatedAt
      isResolved
      activity {
        id
        name
      }
    }
    errors
  }
}

mutation UpdateTodoItem(
  $id: UUID!
  $name: String!
  $activityId: UUID!
  $isResolved: Boolean!
) {
  updateItem(
    id: $id
    name: $name
    activityId: $activityId
    isResolved: $isResolved
  ) {
    item {
      id
      name
      createdAt
      updatedAt
      isResolved
      activity {
        id
        name
      }
    }
    errors
  }
}

mutation DeleteTodoItem($id: UUID!) {
  deleteItem(id: $id) {
    success
    errors
  }
}
