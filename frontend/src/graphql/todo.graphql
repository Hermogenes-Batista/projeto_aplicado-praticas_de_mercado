query TodoItems($isResolved: Boolean) {
  items(isResolved: $isResolved) {
    ...TodoItemFields
  }
}

query TodoActivities {
  activities {
    ...TodoActivityWithItemsFields
    createdBy {
      ...UserFields
    }
  }
}

mutation CreateTodoActivity($name: String!, $dueDate: DateTime, $items: [ItemInput!]) {
  createActivity(name: $name, dueDate: $dueDate, items: $items) {
    errors
    activity {
      ...TodoActivityWithItemsFields
      createdBy {
        ...UserFields
      }
    }
  }
}

mutation UpdateTodoActivity($id: UUID!, $name: String!, $dueDate: DateTime) {
  updateActivity(id: $id, name: $name, dueDate: $dueDate) {
    activity {
      ...TodoActivityWithItemsFields
      createdBy {
        ...UserFields
      }
    }
    errors
  }
}

mutation DeleteTodoActivity($id: UUID!) {
  deleteActivity(id: $id) {
    success
    errors
  }
}

mutation CompleteTodoActivity($id: UUID!, $isResolved: Boolean!) {
  completeActivity(id: $id, isResolved: $isResolved) {
    activity {
      ...TodoActivityWithItemsFields
      createdBy {
        ...UserFields
      }
    }
    errors
  }
}

mutation CreateTodoItem(
  $name: String!
  $activityId: UUID!
  $isResolved: Boolean
) {
  createItem(
    name: $name
    activityId: $activityId
    isResolved: $isResolved
  ) {
    item {
      ...TodoItemFields
    }
    errors
  }
}

mutation UpdateTodoItem(
  $id: UUID!
  $name: String!
  $activityId: UUID!
  $isResolved: Boolean!
) {
  updateItem(
    id: $id
    name: $name
    activityId: $activityId
    isResolved: $isResolved
  ) {
    item {
      ...TodoItemFields
    }
    errors
  }
}

mutation DeleteTodoItem($id: UUID!) {
  deleteItem(id: $id) {
    success
    errors
  }
}

fragment TodoItemFields on ItemType {
  id
  name
  createdAt
  updatedAt
  isResolved
  activity {
    id
    name
  }
  createdBy {
    ...UserFields
  }
}

fragment TodoActivityWithItemsFields on ActivityType {
  id
  name
  dueDate
  createdAt
  updatedAt
  isResolved
  items {
    ...TodoItemFields
  }
}
