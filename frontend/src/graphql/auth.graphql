query CurrentUser {
  me {
    id
    username
    email
    firstName
    lastName
    isStaff
  }
}

mutation Login($username: String!, $password: String!) {
  login(username: $username, password: $password) {
    success
    errors
    access
    refresh
    user {
      id
      username
      email
      firstName
      lastName
      isStaff
    }
  }
}

mutation Logout($refresh: String!) {
  logout(refresh: $refresh) {
    success
    errors
  }
}
