query CurrentUser {
  me {
    ...UserFields
  }
}

mutation AuthenticateUser($username: String!, $password: String!) {
  login(username: $username, password: $password) {
    success
    errors
    access
    refresh
    user {
      ...UserFields
    }
  }
}

mutation EndSession {
  logout {
    success
    errors
  }
}

mutation RefreshSession {
  refreshToken {
    success
    errors
    access
    refresh
  }
}

query GoogleConfig {
  googleClientId
}

mutation AuthenticateGoogle(
  $credential: String
  $code: String
  $redirectUri: String
  $demo: Boolean
  $email: String
  $name: String
) {
  loginWithGoogle(
    credential: $credential
    code: $code
    redirectUri: $redirectUri
    demo: $demo
    email: $email
    name: $name
  ) {
    success
    errors
    access
    refresh
    user {
      ...UserFields
    }
  }
}

fragment UserFields on UserType {
  id
  username
  email
  firstName
  lastName
  isStaff
}
