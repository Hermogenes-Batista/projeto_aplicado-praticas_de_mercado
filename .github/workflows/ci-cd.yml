name: Deploy de Produção (CI/CD)

on:
  push:
    branches:
      - feature/create-ci-cd-deployment  # Gatilho temporário para testes
      # - main                           # Será ativado após os testes


permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Converter nome do repositório para minúsculas
        id: string
        run: |
          echo "repo_lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # --------------------------------------------------------
      # BUILD E PUSH: BACKEND (CROSS-COMPILING PARA AMD64)
      # --------------------------------------------------------
      - name: Construir e publicar imagem do Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hermogenes-batista/projeto_aplicado-praticas_de_mercado-backend:${{ github.sha }}
            ghcr.io/hermogenes-batista/projeto_aplicado-praticas_de_mercado-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # BUILD E PUSH: FRONTEND (CROSS-COMPILING PARA AMD64)
      # --------------------------------------------------------
      - name: Construir e publicar imagem do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://duckdns.org
          tags: |
            ghcr.io/hermogenes-batista/projeto_aplicado-praticas_de_mercado-frontend:${{ github.sha }}
            ghcr.io/hermogenes-batista/projeto_aplicado-praticas_de_mercado-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: prod
    steps:
      - name: Executar comandos de deploy via SSH na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/projeto-aplicado

            # 1. Atualizar a tag da imagem no arquivo de ambiente
            # Remove linhas antigas de IMAGE_TAG para evitar duplicidade
            sed -i '/^IMAGE_TAG=/d' .env.prod
            echo "IMAGE_TAG=${{ github.sha }}" >> .env.prod

            # 2. Baixar as novas imagens do GHCR
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            # 3. Executar as migrações de banco em um container temporário
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python projeto_aplicado/manage.py migrate --noinput

            # 4. Atualizar os serviços em background de forma transparente
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            # 5. Limpeza de imagens antigas sem uso (evita encher o disco da VM)
            docker image prune -f

            # 6. Aguardar estabilização e rodar Health Check interno
            echo "Aguardando estabilização dos serviços..."
            sleep 15
            
            echo "Executando Health Check interno..."
            curl --fail http://127.0.0 || exit 1
            
            echo "Deploy finalizado com sucesso!"
